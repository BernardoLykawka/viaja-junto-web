      <g stroke="${C.pine}" stroke-width="7" stroke-linecap="round"><path d="M-10 250 L60 154"/><path d="M30 250 L84 154"/><path d="M70 250 L106 154"/><path d="M110 250 L128 154"/><path d="M150 250 L150 154"/><path d="M190 250 L172 154"/></g>`,
    city: `<g fill="${C.sage}"><rect x="0" y="120" width="40" height="90"/><rect x="150" y="110" width="50" height="100"/></g><g fill="${C.pine}"><rect x="40" y="96" width="30" height="114"/><rect x="118" y="88" width="32" height="122"/><path d="M84 40 L92 22 L100 40 V210 H84 Z"/></g><rect y="200" width="200" height="50" fill="${C.forest}"/>`,

}
const media = (photo, kind, alt = '') => photo ? `<img src="${photo}" alt="${esc(alt)}" loading="lazy">` : scene(kind);

/* ---------- Tela: Painel inicial (screens/painel.md) ---------- */
const TODAY = new Date();
const daysUntil = (iso) => Math.max(0, Math.ceil((d(iso) - TODAY) / 86400000));

function renderDashboard() {

  const days = next ? daysUntil(next.start) : 0;
  const nextFree = next && next.budget ? next.budget - sum(next.expenses.map((e) => e.amount)) : null;

  return `
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero-art">
      <div class="shape" aria-hidden="true"></div>
      <div class="photo">${media(next?.photo, next?.scene || 'peaks', next ? `Foto de ${next.stops[0]?.city}, primeiro destino de ${next.name}` : '')}</div>
      ${next ? `<a class="floating-card" href="#/viagem/${next.id}" aria-label="Próxima viagem: ${esc(next.name)}, faltam ${days} dias">
        <div class="top"><div><p class="type-label-sm muted">Próxima viagem</p><p class="type-title-md" style="color:var(--color-tertiary)">${esc(next.name)}</p></div>
          <span class="days-pill"><span class="type-numeric-md">${days}<small>dias</small></span></span></div>
        <div class="top">${avatars(next.members)}<span class="type-body-sm muted">${next.members.length} viajantes</span></div>
      </a>` : ''}
      <a class="map-button" href="#/viagens" aria-label="Ver os países visitados no mapa">
        <svg viewBox="0 0 112 112" aria-hidden="true"><defs><path id="ring" d="M56 56 m-44 0 a44 44 0 1 1 88 0 a44 44 0 1 1 -88 0"/></defs>
          <circle class="ring-bg" cx="56" cy="56" r="54"/>
          <text class="type-label-sm" fill="currentColor" style="letter-spacing:.24em"><textPath href="#ring">ver no mapa · ver no mapa ·</textPath></text></svg>
        <span class="core"><i class="ph ph-map-trifold" aria-hidden="true"></i></span>
      </a>
    </div>
    <div class="container">
      <div class="hero-copy">
        <p class="hero-overline type-label-overline">Planeje. Divida. Viaje.
          <svg viewBox="0 0 88 24" aria-hidden="true"><path d="M2 20 C24 22 44 18 62 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M70 4 l12 6 -12 6 2 -6 z" fill="currentColor"/></svg></p>
        <h1 id="hero-title" class="hero-title type-display-hero">Sua viagem <em>começa aqui.</em></h1>
        <p class="hero-text type-body-lg">Monte o roteiro com o grupo, controle o orçamento e descubra os lugares mais bem avaliados.</p>
        <div class="hero-actions">

        </div>
      </div>
    </div>
  </section>

  <div class="container">
    <form class="search-bar" role="search" aria-label="Começar uma viagem" onsubmit="return false">
      ${[['map-pin', 'Para onde?', 'Buscar destinos'], ['calendar-blank', 'Ida', 'Adicionar data'], ['calendar-blank', 'Volta', 'Adicionar data'], ['users-three', 'Viajantes', 'Só você']].map(([ic, l, v]) =>
        `<button class="search-field" type="button"><span class="field-icon"><i class="ph ph-${ic}" aria-hidden="true"></i></span>
          <span class="field-text"><span class="type-label-md">${l}</span><span class="type-body-sm muted">${v}</span></span><i class="ph ph-caret-down caret" aria-hidden="true"></i></button>`).join('')}
      <button class="search-button type-label-lg" type="submit" aria-label="Buscar"><i class="ph ph-magnifying-glass" aria-hidden="true"></i><span class="label">Buscar</span></button>
    </form>

    <div class="band">
      <div class="band-left">
        ${next ? `<section class="promo-banner" aria-labelledby="promo-title">
          <div class="art" aria-hidden="true">${scene('peaks')}</div>
          <span class="promo-badge type-label-sm">Próxima viagem</span>
          <h2 id="promo-title" class="type-headline-md">${esc(next.name)}: <em>faltam ${days} dias</em></h2>
          <p class="type-body-sm" style="color:var(--color-neutral)">${nextFree !== null ? `${money(nextFree)} ainda livres no orçamento` : 'Defina o orçamento do grupo'}</p>
          <a class="button button-pill-light type-label-md" href="#/viagem/${next.id}">Abrir roteiro <i class="ph ph-arrow-right" aria-hidden="true"></i></a>

        <section class="stats-strip" aria-label="Seus números">
          <div class="item"><span class="stat-icon"><i class="ph ph-airplane-tilt" aria-hidden="true"></i></span><div><p class="type-title-md">${active.length}</p><p class="type-body-sm muted">viagens</p></div></div>
          <div class="item"><span class="stat-icon warm"><i class="ph ph-globe-hemisphere-west" aria-hidden="true"></i></span><div><p class="type-title-md">6</p><p class="type-body-sm muted">países</p></div></div>
          <div class="item"><span class="stat-icon cool"><i class="ph ph-users-three" aria-hidden="true"></i></span><div><p class="type-title-md">${companions}</p><p class="type-body-sm muted">companheiros</p></div></div>

}

function carousel(id, cards, wide = false) {
  return `<div class="carousel">
    <button class="carousel-arrow prev" type="button" data-scroll="${id}" data-dir="-1" aria-label="Anteriores" hidden><i class="ph ph-caret-left" aria-hidden="true"></i></button>
    <div class="track${wide ? ' wide' : ''}" id="track-${id}">${cards}</div>

}

function tripCard(t) {
  return `<a class="photo-card" href="#/viagem/${t.id}" aria-label="${esc(t.name)}, ${STATUS[t.status].label}, ${fmtRange(t.start, t.end)}">

}

function destinationCard(x) {
  const rating = x.rating.toLocaleString('pt-BR', { minimumFractionDigits: 1 });
  return `<article class="photo-card" tabindex="0" aria-label="${x.city}, ${x.country}, nota ${rating} em ${x.reviews} avaliações">
    ${scene(x.scene)}
    <button class="favorite-button" type="button" aria-label="Salvar ${x.city}" aria-pressed="false"><i class="ph ph-heart" aria-hidden="true"></i></button>
    <div class="caption"><div><p class="type-title-md">${x.city}</p><p class="sub type-body-sm">${x.country}</p></div>
      <span class="rating-pill type-label-md"><i class="ph-fill ph-star" aria-hidden="true"></i>${rating}</span></div>
  </article>`;
}

/* ---------- Tela: Detalhe da viagem ---------- */
let tab = 'roteiro';
function renderTrip(t) {
  const role = myRole(t);
  const canEdit = role !== 'VIEWER';
  const activityCount = sum(t.stops.map((s) => s.activities.length));
  const tabs = [['roteiro', 'Roteiro', 'map-pin', t.stops.length], ['orcamento', 'Orçamento', 'wallet'], ['despesas', 'Despesas', 'receipt', t.expenses.length], ['membros', 'Membros', 'users-three', t.members.length]];

  return `
  <div class="container page-work" data-can-edit="${canEdit}">
  <a class="back type-label-md" href="#/viagens"><i class="ph ph-arrow-left" aria-hidden="true"></i>Minhas viagens</a>

  <section class="hero-banner" aria-labelledby="trip-title">
    ${pattern('pattern')}
    <div>
      ${statusBadge(t.status)}
      <h1 id="trip-title" class="type-display" style="margin-top:var(--spacing-sm-plus)">${esc(t.name)}</h1>
      <p class="hero-meta type-body-md">

        <span><i class="ph ph-map-pin" aria-hidden="true"></i>${t.stops.length} ${t.stops.length === 1 ? 'destino' : 'destinos'} · ${activityCount} ${activityCount === 1 ? 'atividade' : 'atividades'}</span>

      ${role === 'OWNER' ? `<div class="code-box"><span><span class="type-label-sm" style="color:var(--color-neutral)">Código de convite</span><br><span class="code type-label-lg">${t.code}</span></span>
        <button class="button button-compact type-label-md" type="button" data-copy="${t.code}"><i class="ph ph-copy" aria-hidden="true"></i>Copiar</button></div>` : ''}
    </div>

  ${!canEdit ? `<div class="alert alert-info type-body-sm" role="status" style="margin-top:var(--spacing-lg)"><i class="ph-fill ph-eye" aria-hidden="true"></i>
    <p><strong>Você está como visualizador(a).</strong> Pode ver o roteiro, o orçamento e as despesas, mas só a pessoa dona da viagem ou quem edita pode alterar.</p></div>` : ''}

  <div class="tabs" role="tablist" aria-label="Seções da viagem">
    ${tabs.map(([k, l, ic, c]) => `<button class="tab type-label-lg" role="tab" type="button" id="tab-${k}" aria-controls="panel" aria-selected="${tab === k}" data-tab="${k}">
      <i class="${tab === k ? 'ph-fill' : 'ph'} ph-${ic}" aria-hidden="true"></i>${l}${c !== undefined ? `<span class="count type-label-sm">${c}</span>` : ''}</button>`).join('')}
  </div>

  <section id="panel" role="tabpanel" aria-labelledby="tab-${tab}">

function emptyState(icon, title, text, action) {
  return `<div class="card empty"><i class="ph ph-${icon}" aria-hidden="true"></i>
    <h2 class="type-headline-sm card-title">${title}</h2><p class="type-body-md muted">${text}</p>
    ${action ? `<button class="button button-primary type-label-lg can-edit" type="button"><i class="ph ph-plus" aria-hidden="true"></i>${action}</button>` : ''}</div>`;
}

function budgetSummaryCard(t) {
  if (!t.budget) return emptyState('wallet', 'Sem orçamento', 'Defina quanto o grupo pretende gastar para acompanhar o planejado.', 'Definir orçamento');
  const planned = sum(Object.values(t.plannedByCategory));
  const spent = sum(t.expenses.map((e) => e.amount));
  const pct = Math.min(100, Math.round((planned / t.budget) * 100));
  return `<div class="card">
    <div class="section-head" style="margin-bottom:var(--spacing-sm-plus)"><h2 class="type-headline-sm card-title">Orçamento</h2><i class="ph ph-wallet icon-accent" aria-hidden="true"></i></div>
    <p class="type-numeric-lg">${money(t.budget - planned)}</p>
    <p class="type-body-sm muted">livres depois do planejado</p>
    <div class="progress-track" style="margin:var(--spacing-md) 0 var(--spacing-sm)" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Planejado em relação ao orçamento"><div class="progress-fill" style="width:${pct}%"></div></div>
    <p class="type-body-sm muted">${money(planned)} planejados de ${money(t.budget)} · ${pct} %</p>
    <hr class="divider" style="margin:var(--spacing-md) 0">
    <div class="budget-mini"><div class="row"><span class="type-body-sm">Já gasto</span><span class="type-numeric-md">${money(spent)}</span></div></div>
  </div>`;
}

function membersCard(t) {
  return `<div class="card">
    <div class="section-head" style="margin-bottom:var(--spacing-sm)"><h2 class="type-headline-sm card-title">Grupo</h2><span class="type-label-md muted">${t.members.length} pessoas</span></div>
    <ul class="list">${t.members.map(([p, r]) => `<li><span class="avatar sm type-label-md">${PEOPLE[p].initials}</span>
      <span class="grow type-body-md">${PEOPLE[p].name}${p === ME ? ' <span class="muted">(você)</span>' : ''}</span>
      <span class="type-label-md muted" title="${ROLE[r].label}"><i class="ph ph-${ROLE[r].icon}" aria-hidden="true"></i><span class="sr-only">${ROLE[r].label}</span></span></li>`).join('')}</ul>
  </div>`;
}

function itinerary(t) {
  if (!t.stops.length) return `<div class="two-col"><div>${emptyState('map-trifold', 'Nenhum destino ainda', 'Comece pelo primeiro destino. Depois o grupo adiciona as atividades de cada dia.', 'Adicionar destino')}</div><div class="stack">${budgetSummaryCard(t)}${membersCard(t)}</div></div>`;
  return `<div class="two-col">
    <div class="stack">
      <div class="section-head" style="margin:0"><h2 class="type-headline-md card-title">Roteiro</h2>
        <button class="button button-secondary type-label-lg can-edit" type="button"><i class="ph ph-plus" aria-hidden="true"></i>Adicionar destino</button></div>
      ${t.stops.map((s, i) => `<article class="stop">
        <span class="stop-num type-title-md" aria-hidden="true">${i + 1}</span>
        <div class="card">
          <div class="stop-head">
            <div><h3 class="type-headline-sm card-title"><span class="sr-only">Parada ${i + 1}: </span>${s.city}</h3>
              <p class="type-body-sm muted">${s.country} · ${fmtDay(s.from)} – ${fmtDay(s.to)} · ${nights(s.from, s.to)} noites</p></div>
            <button class="button button-compact type-label-md can-edit" type="button"><i class="ph ph-plus" aria-hidden="true"></i>Atividade</button>
          </div>
          ${s.activities.length ? `<ul class="activities">${s.activities.map((a) => `<li class="card-compact activity">
            <span class="time type-numeric-md">${fmtDay(a.day, { day: '2-digit', month: '2-digit' })}<br><span class="type-body-sm">${a.time}</span></span>
            <span class="cat-icon" title="${CATEGORIES[a.type].label}"><i class="ph ph-${CATEGORIES[a.type].icon}" aria-hidden="true"></i></span>
            <span><span class="type-title-md">${esc(a.name)}</span><br><span class="type-body-sm muted">${CATEGORIES[a.type].label}</span></span>
            <span class="right">${a.cost === null ? '<span class="chip static type-label-md">Sem custo</span>' : `<span class="type-numeric-md">${money(a.cost)}</span><span class="type-body-sm muted">previsto</span>`}</span>
          </li>`).join('')}</ul>`
          : `<div class="alert alert-info type-body-sm"><i class="ph-fill ph-info" aria-hidden="true"></i><p>Ainda não há atividades em ${s.city}.</p></div>`}
        </div>
      </article>`).join('')}
    </div>
    <div class="stack">${budgetSummaryCard(t)}${membersCard(t)}</div>
  </div>`;
}

function budget(t) {
  if (!t.budget) return emptyState('wallet', 'Defina o orçamento da viagem', 'Com um valor total, o ViajaJunto mostra o planejado por categoria e quanto ainda sobra.', 'Definir orçamento');
  const planned = sum(Object.values(t.plannedByCategory));
  const spent = sum(t.expenses.map((e) => e.amount));
  const kpis = [['Orçamento total', t.budget, 'wallet'], ['Planejado', planned, 'list-checks'], ['Já gasto', spent, 'receipt'], ['Saldo', t.budget - spent, 'coins']];
  const max = Math.max(...Object.values(t.plannedByCategory), 1);
  return `
  <div class="kpis">${kpis.map(([l, v, ic]) => `<div class="card kpi"><span class="type-label-sm muted"><i class="ph ph-${ic}" aria-hidden="true"></i> ${l}</span><span class="type-numeric-lg">${money(v)}</span></div>`).join('')}</div>
  <div class="two-col">
    <div class="card">
      <div class="section-head"><h2 class="type-headline-sm card-title">Planejado por categoria</h2>
        <button class="button button-compact type-label-md can-edit" type="button"><i class="ph ph-pencil-simple" aria-hidden="true"></i>Editar orçamento</button></div>
      <div class="cat-rows">${Object.entries(CATEGORIES).map(([k, c]) => {
        const v = t.plannedByCategory[k] || 0; const share = planned ? Math.round((v / planned) * 100) : 0;
        return `<div class="cat-row"><div class="row"><span class="label type-label-md"><i class="ph ph-${c.icon} icon-accent" aria-hidden="true"></i>${c.label}</span>
          <span><span class="type-numeric-md">${money(v)}</span> <span class="type-body-sm muted">· ${share} %</span></span></div>
          <div class="progress-track" role="progressbar" aria-valuenow="${share}" aria-valuemin="0" aria-valuemax="100" aria-label="${c.label}"><div class="progress-fill" style="width:${Math.round((v / max) * 100)}%"></div></div></div>`;
      }).join('')}</div>
    </div>
    <div class="stack">
      ${planned <= t.budget
        ? `<div class="alert alert-success type-body-sm"><i class="ph-fill ph-check-circle" aria-hidden="true"></i><p><strong>Dentro do orçamento.</strong> Sobram ${money(t.budget - planned)} além do que já está planejado.</p></div>`
        : `<div class="alert alert-warning type-body-sm"><i class="ph-fill ph-warning" aria-hidden="true"></i><p><strong>Planejado acima do orçamento</strong> em ${money(planned - t.budget)}.</p></div>`}
      ${t.unpriced ? `<div class="alert alert-warning type-body-sm"><i class="ph-fill ph-warning" aria-hidden="true"></i><p><strong>${t.unpriced} ${t.unpriced === 1 ? 'atividade sem custo previsto' : 'atividades sem custo previsto'}.</strong> Elas contam como R$ 0,00 no planejado.</p></div>` : ''}
    </div>
  </div>`;
}

function balances(t) {
  const n = t.members.length; const each = sum(t.expenses.map((e) => e.amount)) / n;
  const bal = Object.fromEntries(t.members.map(([p]) => [p, -each]));
  t.expenses.forEach((e) => { bal[e.payer] += e.amount; });
  const debtors = Object.entries(bal).filter(([, v]) => v < -0.005).map(([p, v]) => [p, -v]);
  const creditors = Object.entries(bal).filter(([, v]) => v > 0.005);
  const out = [];
  for (const [dp, dv] of debtors.sort((a, b) => b[1] - a[1])) {
    let left = dv;
    for (const c of creditors) { if (left < 0.005) break; const pay = Math.min(left, c[1]); if (pay < 0.005) continue; out.push([dp, c[0], Math.round(pay * 100) / 100]); c[1] -= pay; left -= pay; }
  }
  return out;
}

function expenses(t) {
  if (!t.expenses.length) return emptyState('receipt', 'Nenhuma despesa ainda', 'Registre o que alguém já pagou e o ViajaJunto calcula quem deve a quem.', 'Adicionar despesa');
  const total = sum(t.expenses.map((e) => e.amount));
  return `<div class="two-col">
    <div class="card">
      <div class="section-head"><div><h2 class="type-headline-sm card-title">Despesas</h2><p class="type-body-sm muted">${t.expenses.length} registros · ${money(total)} no total · divididas igualmente</p></div>
        <button class="button button-primary type-label-lg can-edit" type="button"><i class="ph ph-plus" aria-hidden="true"></i>Adicionar despesa</button></div>
      <ul class="list">${[...t.expenses].sort((a, b) => b.date.localeCompare(a.date)).map((e) => `<li>
        <span class="cat-icon" title="${CATEGORIES[e.type].label}"><i class="ph ph-${CATEGORIES[e.type].icon}" aria-hidden="true"></i></span>
        <span class="grow"><span class="type-title-md">${esc(e.desc)}</span><br><span class="type-body-sm muted">${PEOPLE[e.payer].name.split(' ')[0]} pagou · ${fmtDay(e.date)}</span></span>
        <span class="money type-numeric-md">${money(e.amount)}</span></li>`).join('')}</ul>
    </div>
    <div class="card">
      <div class="section-head"><h2 class="type-headline-sm card-title">Quem deve a quem</h2><i class="ph ph-arrows-left-right icon-accent" aria-hidden="true"></i></div>
      <ul class="list">${balances(t).map(([from, to, v]) => `<li class="transfer">
        <span class="avatar sm type-label-md">${PEOPLE[from].initials}</span><span class="type-body-md grow">${PEOPLE[from].name.split(' ')[0]} paga ${PEOPLE[to].name.split(' ')[0]}${to === ME ? ' <span class="muted">(você)</span>' : ''}</span>
        <span class="type-numeric-md">${money(v)}</span></li>`).join('')}</ul>
      <button class="button button-secondary type-label-lg can-edit" type="button" style="width:100%;margin-top:var(--spacing-md)"><i class="ph ph-check" aria-hidden="true"></i>Registrar pagamento</button>
    </div>
  </div>`;
}

function members(t, role) {
  return `<div class="two-col"><div class="card">
    <div class="section-head"><h2 class="type-headline-sm card-title">Membros da viagem</h2>
      ${role === 'OWNER' ? `<button class="button button-primary type-label-lg" type="button"><i class="ph ph-user-plus" aria-hidden="true"></i>Convidar</button>` : ''}</div>
    <ul class="list">${t.members.map(([p, r]) => `<li><span class="avatar type-label-md">${PEOPLE[p].initials}</span>
      <span class="grow"><span class="type-title-md">${PEOPLE[p].name}${p === ME ? ' <span class="muted type-body-sm">(você)</span>' : ''}</span><br>
      <span class="type-body-sm muted">${{ OWNER: 'Gerencia a viagem e o grupo', EDITOR: 'Edita roteiro, orçamento e despesas', VIEWER: 'Somente leitura' }[r]}</span></span>
      ${role === 'OWNER' && r !== 'OWNER'
        ? `<label class="sr-only" for="perm-${p}">Permissão de ${PEOPLE[p].name}</label><select class="select type-body-sm" id="perm-${p}"><option ${r === 'EDITOR' ? 'selected' : ''}>Editor(a)</option><option ${r === 'VIEWER' ? 'selected' : ''}>Visualizador(a)</option></select>
           <button class="icon-button" type="button" aria-label="Remover ${PEOPLE[p].name}" style="color:var(--color-on-surface-variant)"><i class="ph ph-trash" aria-hidden="true"></i></button>`
        : `<span class="chip static type-label-md"><i class="ph ph-${ROLE[r].icon}" aria-hidden="true"></i>${ROLE[r].label}</span>`}
    </li>`).join('')}</ul>
  </div>
  <div class="stack">
    ${role === 'OWNER' ? `<div class="alert alert-info type-body-sm"><i class="ph-fill ph-info" aria-hidden="true"></i><p>Compartilhe o código <strong>${t.code}</strong>. Quem entrar começa como visualizador(a), e você pode mudar a permissão aqui.</p></div>`
      : `<div class="alert alert-info type-body-sm"><i class="ph-fill ph-lock-simple" aria-hidden="true"></i><p>Só a pessoa dona da viagem convida e muda permissões.</p></div>`}
  </div></div>`;
}

/* ---------- Roteamento e eventos ---------- */
const app = document.getElementById('app');
function route() {
  const m = location.hash.match(/^#\/viagem\/([\w-]+)/);
  const trip = m && TRIPS.find((t) => t.id === m[1]);
  document.body.classList.toggle('discovery', !trip);
  app.innerHTML = trip ? renderTrip(trip) : renderDashboard();
  document.title = `${trip ? trip.name : 'Minhas viagens'} · ViajaJunto`;
}
window.addEventListener('hashchange', () => { tab = 'roteiro'; route(); app.focus({ preventScroll: true }); window.scrollTo(0, 0); });
app.addEventListener('click', (ev) => {
  const sc = ev.target.closest('[data-scroll]'); if (sc) { const tr = document.getElementById('track-' + sc.dataset.scroll); tr.scrollBy({ left: Number(sc.dataset.dir) * tr.clientWidth * 0.8, behavior: 'smooth' }); return; }
  const fav = ev.target.closest('.favorite-button'); if (fav) { const on = fav.getAttribute('aria-pressed') !== 'true'; fav.setAttribute('aria-pressed', on); fav.innerHTML = `<i class="${on ? 'ph-fill' : 'ph'} ph-heart" aria-hidden="true"></i>`; return; }
  const tb = ev.target.closest('[data-tab]'); if (tb) { tab = tb.dataset.tab; route(); document.getElementById('tab-' + tab).focus(); return; }
  const cp = ev.target.closest('[data-copy]'); if (cp) { navigator.clipboard?.writeText(cp.dataset.copy); cp.innerHTML = '<i class="ph ph-check" aria-hidden="true"></i>Copiado'; }
});
app.addEventListener('keydown', (ev) => {
  const tb = ev.target.closest('[role="tab"]'); if (!tb || !['ArrowLeft', 'ArrowRight'].includes(ev.key)) return;
  const all = [...app.querySelectorAll('[role="tab"]')]; const i = all.indexOf(tb) + (ev.key === 'ArrowRight' ? 1 : -1);
  tab = all[(i + all.length) % all.length].dataset.tab; route(); document.getElementById('tab-' + tab).focus();
});
// Setas do carrossel: some a "anterior" no início e a "próxima" no fim.
app.addEventListener('scroll', (ev) => {
  const tr = ev.target; if (!tr.classList || !tr.classList.contains('track')) return;
  const box = tr.parentElement;
  box.querySelector('.prev').hidden = tr.scrollLeft < 8;
  box.querySelector('.next').hidden = tr.scrollLeft + tr.clientWidth > tr.scrollWidth - 8;
}, true);
route();
</script>
</body>
</html>
